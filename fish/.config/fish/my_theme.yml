# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
# Dracula palette — https://draculatheme.com — segment text on dark #282a36 (Background)
# Taskwarrior “current task” = started task (+ACTIVE); run `task <id> start` to set.
# Use alignment: right (not type: rprompt): fish draws fish_right_prompt on the cursor line, so rprompt would move to line 2 with a multiline prompt.

blocks:
    - type: prompt
      alignment: left
      segments:
        - leading_diamond: 
          trailing_diamond: 
          template: ' {{ .UserName }} '
          foreground: '#282a36'
          background: '#ffb86c'
          type: session
          style: diamond
        - options:
            style: folder
          trailing_diamond: 
          template: ' {{ .Path }} '
          foreground: '#282a36'
          background: '#8be9fd'
          type: path
          style: diamond
        - options:
            fetch_status: true
            fetch_upstream_icon: true
            branch_template: '{{ abbrev 32 .Branch }}'
            mapped_branches:
                bug/*: "\U0001F41B "
                feature/*: "\U0001F680 "
            # source: cli
            untracked_modes:
                /Users/user/Projects/oh-my-posh/: "no"
          trailing_diamond: 
          template: '{{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }}'
          foreground: '#282a36'
          background: '#bd93f9'
          type: git
          style: diamond
          background_templates:
            - '{{ if or (.Working.Changed) (.Staging.Changed) }}#bd93f9{{ end }}'
            - '{{ if and (gt .Ahead 0) (gt .Behind 0) }}#bd93f9{{ end }}'
            - '{{ if gt .Ahead 0 }}#8be9fd{{ end }}'
            - '{{ if gt .Behind 0 }}#ff5555{{ end }}'
        - trailing_diamond: 
          template: '  {{ .Full }} '
          foreground: '#282a36'
          background: '#50fa7b'
          type: node
          style: diamond
    - type: prompt
      alignment: right
      overflow: hide
      segments:
        - leading_diamond: 
          template: ' {{ .Env.POSH_GITHUB_USER }} '
          foreground: '#282a36'
          background: '#f1fa8c'
          type: text
          style: diamond
        - leading_diamond: 
          template: ' {{ if .Commands.Active }}{{ $tasks := .Commands.Active | fromJson }}{{ if gt (len $tasks) 0 }}{{ "\uf4a0" }} {{ index (index $tasks 0) "description" | trunc 70 }}{{ end }}{{ end }}'
          foreground: '#282a36'
          background: '#ff79c6'
          type: taskwarrior
          style: diamond
          options:
            commands:
              active: "+ACTIVE +PENDING limit:1 export"
        - options:
            time_format: "15:04:05"
          leading_diamond: 
          trailing_diamond: 
          template: ' {{ .CurrentDate | date .Format }} '
          foreground: '#282a36'
          background: '#ff5555'
          type: time
          style: diamond
    - type: prompt
      alignment: left
      newline: true
      segments:
        - type: text
          style: plain
          foreground: '#f8f8f2'
          template: '❯ '
version: 4
final_space: true
