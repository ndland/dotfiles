# Portable developer toolchain.
#
# Phase 1D pins the validated workstation baseline so a fresh
# WSL/Linux/macOS bootstrap requests these exact tool versions.
#
# Upgrade intentionally with:
#   mise use -g --pin <tool>@<version>
#
# Then re-run workstation validation before committing the bump.
#
# Language runtimes beyond Node are installed on demand:
#   mise use python@...
#   mise use go@...
#   mise use rust@...
#   mise use java@...

[tools]
node = "26.8.2"
neovim = "0.12.5"
tree-sitter = "0.27.0"
stylua = "2.5.2"
delta = "0.19.2"
github-cli = "2.100.0"
"github:anomalyco/opencode" = "1.18.30"

bat = "0.26.1"
eza = "0.23.5"
fd = "10.5.0"
uv = "0.12.13"
yazi = "26.9.1"
zoxide = "0.10.0"
"github:gastownhall/beads" = "latest"
