# ===============================================================
# AI-native persistent workspace
# ===============================================================

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g history-limit 100000
set -g mouse on
set -g focus-events on
set -sg escape-time 10

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"

set -g set-clipboard on
set -g allow-passthrough on
set -g detach-on-destroy off

setw -g mode-keys vi

# Panes/windows preserve working directory.

unbind '"'
unbind %

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

bind r \
    source-file ~/.config/tmux/tmux.conf \; \
    display-message "tmux config reloaded"

# Vi copy mode + cross-platform clipboard.

bind -T copy-mode-vi v \
    send -X begin-selection

bind -T copy-mode-vi y \
    send -X copy-pipe-and-cancel \
    "$HOME/.local/bin/clipboard-copy"

bind -T copy-mode-vi MouseDragEnd1Pane \
    send -X copy-pipe-and-cancel \
    "$HOME/.local/bin/clipboard-copy"

bind P paste-buffer

# Persistent sessions.

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

# One plugin manager, one location.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'

# Quiet useful status.

set -g status-interval 5
set -g status-left-length 50
set -g status-right-length 100

set -g status-left ' #S '
set -g status-right ' #{pane_current_path} | %H:%M '

setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W* '

run '~/.tmux/plugins/tpm/tpm'

# OPENCODE_SHIFT_ENTER_START
# tmux 3.4 predates extended-keys-format. Recognize WezTerm's
# Shift+Enter CSI-u bytes explicitly, then forward them unchanged.
set -s user-keys[99] "\e[13;2u"
bind-key -n User99 send-keys -H 1b 5b 31 33 3b 32 75
# OPENCODE_SHIFT_ENTER_END
